name: Aplicar exclusão de contas (v77)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/apply-admin-delete.mjs
    branches: [claude/mobile-desktop-compatibility-tkbd2w]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mobile-desktop-compatibility-tkbd2w
      - name: Aplicar patch
        run: node scripts/apply-admin-delete.mjs
      - name: Commit e push
        run: |
          git config user.name "stok-bot"
          git config user.email "stok@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nada para commitar"
            exit 0
          fi
          git commit -m "v77: gestor pode apagar contas locais"
          git push
