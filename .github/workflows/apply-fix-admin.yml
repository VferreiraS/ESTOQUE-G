name: Fix admin menu + S badge (v80)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/apply-fix-admin.mjs
      - scripts/fix-admin-badge.js
    branches: [claude/mobile-desktop-compatibility-tkbd2w]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mobile-desktop-compatibility-tkbd2w
      - run: node scripts/apply-fix-admin.mjs
      - name: Commit
        run: |
          git config user.name "stok-bot"
          git config user.email "stok@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo noop; exit 0; fi
          git commit -m "v80: Administração no menu + selo S da logo"
          git push
