name: Aplicar híbrido v78

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/apply-hybrid.mjs
      - scripts/hybrid-admin.js
    branches: [claude/mobile-desktop-compatibility-tkbd2w]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mobile-desktop-compatibility-tkbd2w
      - run: node scripts/apply-hybrid.mjs
      - name: Commit
        run: |
          git config user.name "stok-bot"
          git config user.email "stok@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo "noop"; exit 0; fi
          git commit -m "v78: backup cifrado + gestor redefine senha auxiliar"
          git push
