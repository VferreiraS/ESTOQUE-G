name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main, claude/mobile-desktop-compatibility-tkbd2w]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site
          cp index.html robo.html manifest.webmanifest sw.js .nojekyll _site/
          cp -r icons vendor _site/ 2>/dev/null || cp -r icons _site/
          cp privacidade.html termos.html _site/
          if [ -d central-agentes ]; then
            mkdir -p _site/central-agentes
            cp central-agentes/index.html central-agentes/README.md _site/central-agentes/ 2>/dev/null || true
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
