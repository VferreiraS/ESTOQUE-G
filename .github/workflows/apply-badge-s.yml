name: Aplicar selo S vermelho (v79)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/apply-badge-s.mjs
      - scripts/badge-s.js
    branches: [claude/mobile-desktop-compatibility-tkbd2w]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mobile-desktop-compatibility-tkbd2w
      - run: node scripts/apply-badge-s.mjs
      - name: Commit
        run: |
          git config user.name "stok-bot"
          git config user.email "stok@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo noop; exit 0; fi
          git commit -m "v79: selo verificado S vermelho com efeito vivo"
          git push
